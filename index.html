<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TECTON 7200 — 3D</title>
<style>
:root{--bg:#f4f5f7;--panel:#ffffff;--ink:#1d2430;--muted:#6b7480;--line:#e3e6ea;--acc:#1f5fd1;--dim:#c0392b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181d;--panel:#1e232a;--ink:#e8ebef;--muted:#9aa3ad;--line:#2d333b;--acc:#5b8ef0;--dim:#ff7b6b}}
:root[data-theme="dark"]{--bg:#15181d;--panel:#1e232a;--ink:#e8ebef;--muted:#9aa3ad;--line:#2d333b;--acc:#5b8ef0;--dim:#ff7b6b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;overflow:hidden}
#app{display:flex;height:100%}
#side{width:300px;flex:none;background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:16px}
#view{position:relative;flex:1;min-width:0;overflow:hidden}
canvas{display:block}
h1{font-size:18px;margin:0 0 2px}
.sub{color:var(--muted);font-size:12px;margin-bottom:14px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 0 8px}
.row{display:flex;align-items:center;gap:8px;padding:5px 0;cursor:pointer;user-select:none}
.row input{width:16px;height:16px;accent-color:var(--acc)}
.sw{width:10px;height:10px;border-radius:2px;flex:none}
.btns{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;cursor:pointer}
button.on{background:var(--acc);border-color:var(--acc);color:#fff}
#info,#meas,#hint{z-index:5}
#info{position:absolute;right:12px;top:12px;width:300px;max-width:calc(100% - 24px);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:none;box-shadow:0 6px 24px rgba(0,0,0,.12)}
#info h3{margin:0 24px 4px 0;font-size:14px;line-height:1.25}
#info table{width:100%;border-collapse:collapse;font-size:12.5px}
#info td{padding:3px 0;vertical-align:top;border-top:1px solid var(--line)}
#info td:first-child{color:var(--muted);width:42%;padding-right:8px}
#ichips{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 4px}#ichips span{font-size:12px;font-weight:600;padding:2px 7px;border-radius:999px;background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc)}
#isub{font-size:12px;color:var(--muted)}#imore{border:0;background:none;color:var(--acc);font-size:12px;padding:4px 0 0;margin:0}
#info table{display:none;margin-top:6px}#info.full table{display:table}
#info .x{position:absolute;right:8px;top:6px;border:0;background:none;font-size:18px;color:var(--muted);padding:2px 6px}
#hint{position:absolute;left:12px;bottom:12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--muted)}
#meas{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--dim);color:#fff;border-radius:8px;padding:6px 12px;font-size:13px;display:none}
.dl{font:600 11.5px/1 system-ui,Arial,sans-serif;color:var(--dim);background:var(--panel);border:1px solid var(--dim);border-radius:4px;padding:2px 5px;white-space:nowrap;pointer-events:none}
.dl.m{background:var(--dim);color:#fff}
.pl{font:600 10px/1.15 system-ui,Arial,sans-serif;background:var(--panel);border:1px solid;border-radius:4px;padding:1px 4px;white-space:pre;text-align:center;pointer-events:none}
.pl.lk{pointer-events:auto;cursor:pointer}
.pl.isti{color:#d0342c;border-color:#d0342c}.pl.soyuq{color:#1f6fd1;border-color:#1f6fd1}.pl.kan{color:#6b7480;border-color:#6b7480}
.pl.elp{background:#e08a00;color:#fff;border-color:#e08a00}.pl.zcp{background:#2e7d32;color:#fff;border-color:#2e7d32}
.pl.el{color:#c26a00;border-color:#e08a00}.pl.zc{color:#2e7d32;border-color:#2e7d32}
.mode button{flex:1}
#step{position:absolute;right:12px;top:12px;width:320px;max-width:calc(100% - 24px);max-height:calc(100% - 24px);overflow:auto;z-index:6;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px 10px;display:none;box-shadow:0 6px 24px rgba(0,0,0,.14);font-size:12.5px}
#step .sh{display:flex;gap:6px;align-items:center;margin-bottom:6px}#step .sh select{flex:1;min-width:0;font:inherit;font-size:12.5px;padding:5px 6px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
#step .sh button{padding:5px 10px}#step .x2{border:0;background:none;font-size:18px;color:var(--muted);padding:2px 6px}
#step .code{display:inline-block;font-weight:800;font-size:15px;color:#fff;background:#ff2d7a;border-radius:6px;padding:2px 8px;margin-right:6px}
#step h4{margin:4px 0 6px;font-size:14px;display:flex;align-items:center;flex-wrap:wrap;gap:4px}
#step .kv{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}#step .kv span{background:color-mix(in srgb,var(--acc) 13%,transparent);color:var(--acc);font-weight:600;border-radius:999px;padding:2px 8px;font-size:12px}
#step ol{margin:2px 0 8px;padding-left:20px}#step li{margin:2px 0}#step .lbl{color:var(--muted);font-size:11.5px;margin-top:4px}
#step .mk{font:700 13px/1.3 ui-monospace,Consolas,monospace;border:1.5px dashed #ff2d7a;border-radius:6px;padding:6px 8px;margin-top:2px;user-select:all}
.chips button.stepb{border-color:#ff2d7a;color:#ff2d7a;font-weight:600}.chips button.stepb.on{background:#ff2d7a;color:#fff}
#modehelp{color:var(--muted);font-size:12px;margin-top:6px}
#mk{margin-top:8px;font-size:12px}#mk summary{cursor:pointer;color:var(--acc);font-weight:600}#mktab{width:100%;border-collapse:collapse;margin-top:4px}#mktab td{padding:3px 4px;border-top:1px solid var(--line);vertical-align:top}#mktab tr{cursor:pointer}#mktab td:first-child{font-weight:700;white-space:nowrap;color:var(--ink)}#mktab td:last-child{color:var(--muted);white-space:nowrap}
#load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chips:empty{display:none}
.chips button{font-size:12.5px;padding:5px 10px;border-radius:999px}
.chips button.on{background:var(--acc);border-color:var(--acc);color:#fff}
#tog{display:none}
@media (max-width:760px){
 #app{display:block}
 #view{position:fixed;inset:0}
 #side{position:fixed;top:0;left:0;right:0;z-index:20;width:auto;height:auto;max-height:none;overflow:visible;padding:8px 10px 10px;border:0;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--panel) 90%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
 #side h1{font-size:15px;display:inline-block;margin:5px 0 8px}
 #side .sub,#side>h2{display:none}
 #tog{display:flex;align-items:center;justify-content:center;position:absolute;left:12px;top:calc(100% + 12px);z-index:2;width:46px;height:46px;padding:0;border-radius:50%;transition:left .22s ease,background .15s,color .15s;background:var(--acc);color:#fff;border:2px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.35)}
 #tog::before{content:"";position:absolute;inset:-2px;border-radius:50%;border:3px solid var(--acc);animation:ping 1.6s ease-out infinite;pointer-events:none}
 #tog::after{content:"Menyu";position:absolute;left:calc(100% + 8px);top:50%;transform:translateY(-50%);background:var(--acc);color:#fff;font:600 13px/1 system-ui,Arial,sans-serif;padding:7px 10px;border-radius:999px;white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.3);animation:nudge 1.6s ease-in-out infinite;pointer-events:none}
 #side.seen #tog::before,#side.open #tog::before{animation:none;opacity:0}
 #side.seen #tog::after,#side.open #tog::after{display:none}
 @keyframes ping{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.8);opacity:0}}
 @keyframes nudge{0%,100%{transform:translate(0,-50%)}50%{transform:translate(4px,-50%)}}
 #side.open #tog{background:#fff;color:var(--acc);border-color:var(--acc);left:calc(min(64vw,270px) + 10px)}
 #side .mode{flex-wrap:nowrap}
 #side .mode button{padding:8px 6px}
 #side .chips{flex-wrap:nowrap;overflow-x:auto}
 #side .chips button{flex:none;padding:6px 11px}
 #side .body{position:absolute;left:0;top:100%;width:min(64vw,270px);height:calc(100dvh - var(--barH,100px));overflow:auto;-webkit-overflow-scrolling:touch;
  padding:4px 12px 16px;background:color-mix(in srgb,var(--panel) 72%,transparent);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
  border-right:1px solid var(--line);border-radius:0 12px 0 0;box-shadow:4px 0 18px rgba(0,0,0,.18);
  transform:translateX(-105%);transition:transform .22s ease;visibility:hidden}
 #side.open .body{transform:none;visibility:visible}
 #side .body h2{margin:12px 0 6px}
 #side .body .btns button{padding:6px 9px;font-size:12.5px}
 #step{top:auto;bottom:10px;left:10px;right:10px;width:auto;max-width:none;height:42vh;max-height:42vh;padding:6px 10px 8px;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-size:12px}
 #info{top:auto;bottom:10px;left:10px;right:auto;width:auto;max-width:min(300px,calc(100% - 20px));max-height:40vh;overflow:auto;padding:8px 11px;background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
 #info h3{font-size:13.5px}
 #info table{font-size:12px}
 #hint{display:none}
 #meas{top:auto;bottom:10px}
 .dl{font-size:10px;padding:1px 4px} .pl{font-size:9px;padding:1px 3px;border-radius:3px}
 .row{padding:8px 0}.row input{width:20px;height:20px}
 .btns button{padding:8px 10px}
}
</style>

<body>
<div id="app">
 <aside id="side">

   <div id="sbody"></div></div>

const toMM = v=>({x:v.x*1000, y:-v.z*1000, z:v.y*1000});
const LAYERS = [
 ["01_Karkas","Karkas (metal profil)","#607d8b"],["02_Doseme","Döşəmə OSB 15 mm","#b98a4a"],["03_Das_yunu","Daş yunu","#8d9168"],
 ["05_OSB_ve_Betopan","Divar/tavan OSB 9 mm, betopan","#c69c5d"],["08_Gipskarton","Alçıpan 10 mm","#e0e0dc"],["09_Laminat","Laminat","#a0703f"],["04_Buxar_bariyeri","Par izolyasiyası (içəri)","#b8c9d8"],["16_Hidroizolyasiya","Hidro-külək membranı","#9fb4c8"],["06_Elektrik","Elektrik","#e08a00"],["07_Santexnika","Santexnika","#1f5fd1"],
 ["13_Havalandirma","Havalandırma","#9e9e9e"],["15_Kondisioner","Kondisioner","#6a1b9a"],["12_Metbex","Mətbəx","#8bc34a"],
 ["14_Yataq_mebel","Yataq mebeli","#a1887f"],["10_Dam","Dam","#455a64"],["11_Fasad","Fasad","#37474f"],["17_Pencere_qapi","Pəncərə və qapılar","#111111"],["18_Pille","Giriş pilləsi","#9e9e9e"],["19_Interyer_dizayn","İnteryer dizaynı","#c8a27a"],["20_Dartma_tavan","Dartma tavan","#f0f0f0"]];

 "Yalnız elektrik": ["01_Karkas","02_Doseme","06_Elektrik"],

 "İnteryer": ["02_Doseme","08_Gipskarton","09_Laminat","12_Metbex","14_Yataq_mebel","15_Kondisioner","17_Pencere_qapi","19_Interyer_dizayn","20_Dartma_tavan","06_Elektrik"],
};

// each: [group, label, p1, p2, offset vector (mm)]
const D = [
 ["umumi","7200 — evin uzunu (karkas)",[-3600,-1600,0],[3600,-1600,0],[0,-450,0]],
 ["umumi","3200 — evin eni (karkas)",[3600,-1600,0],[3600,1600,0],[450,0,0]],
 ["umumi","2800 — karkasın hündürlüyü",[3600,-1600,0],[3600,-1600,2800],[300,-300,0]],
 ["umumi","200 — ayaq (yerdən)",[-3600,-1600,-200],[-3600,-1600,0],[-250,-250,0]],
 ["otaq","6962 — daxili uzunluq",[-3481,-1300,2631],[3481,-1300,2631],[0,0,0]],
 ["otaq","2962 — daxili en",[-3300,-1481,2631],[-3300,1481,2631],[0,0,0]],
 ["otaq","2512 — mətbəx/qonaq",[-3481,1300,FFL],[-969,1300,FFL],[0,0,0]],
 ["otaq","2720 — yataq otağı",[761,-900,FFL],[3481,-900,FFL],[0,0,0]],
 ["otaq","1585 — hamam (en)",[-898,1200,110],[687,1200,110],[0,0,0]],
 ["otaq","1728 — hamam (dərinlik)",[-500,-238,110],[-500,1490,110],[0,0,0]],
 ["otaq","1164 — dəhliz",[200,-1481,FFL],[200,-317,FFL],[0,0,0]],
 ["otaq","2516 — döşəmədən dartma tavana",[3300,1300,FFL],[3300,1300,2631],[0,0,0]],
 ["otaq","2585 — döşəmədən OSB tavana",[3100,1300,FFL],[3100,1300,2700],[0,0,0]],
 ["acilis","2010 — böyük pəncərə (en)",[-3102,-1600,2348],[-1092,-1600,2348],[0,-150,120]],
 ["acilis","2048 — böyük pəncərə (hündürlük)",[-1092,-1600,300],[-1092,-1600,2348],[120,-150,0]],
 ["acilis","185 — pəncərə altı (döşəmədən)",[-1500,-1600,FFL],[-1500,-1600,300],[0,-150,0]],
 ["acilis","1111 — kiçik pəncərə (en)",[1989,-1600,2350],[3100,-1600,2350],[0,-150,120]],
 ["acilis","1400 — kiçik pəncərə (hündürlük)",[3100,-1600,950],[3100,-1600,2350],[120,-150,0]],
 ["acilis","835 — pəncərə altı (döşəmədən)",[2500,-1600,FFL],[2500,-1600,950],[0,-150,0]],
 ["acilis","920 — giriş qapısı (en)",[-560,-1600,2350],[360,-1600,2350],[0,-150,120]],
 ["acilis","2235 — giriş qapısı (hündürlük)",[360,-1600,FFL],[360,-1600,2350],[120,-150,0]],
 ["acilis","809 — hamam qapısı (en)",[-505,-317,2353],[304,-317,2353],[0,-60,80]],
 ["acilis","2243 — hamam qapısı (hündürlük)",[304,-317,110],[304,-317,2353],[80,-60,0]],
 ["acilis","400 × 500 — hamam pəncərəsi",[60,1600,2350],[460,1600,2350],[0,150,100]],
];
const GROUPS = [["umumi","Ümumi ölçülər",true],["otaq","Otaqlar və hündürlük",false],["acilis","Pəncərə və qapılar",false]];

// ---------- scene ----------
const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace = THREE.SRGBColorSpace; view.appendChild(renderer.domElement);
const lab = new CSS2DRenderer(); lab.domElement.style.cssText='position:absolute;top:0;left:0;pointer-events:none;z-index:1'; view.appendChild(lab.domElement);

bg(); matchMedia('(prefers-color-scheme: dark)').addEventListener('change', bg);

addEventListener('resize', size); size();

const dimCol = ()=>getComputedStyle(document.documentElement).getPropertyValue('--dim').trim()||'#c0392b';
function dimension(text, a, b, off, cls){
 const g = new THREE.Group(); const o = new THREE.Vector3(...off);
 const A = M(a[0]+o.x, a[1]+o.y, a[2]+o.z), B = M(b[0]+o.x, b[1]+o.y, b[2]+o.z);
 const mat = new THREE.LineBasicMaterial({color:dimCol(), depthTest:false, transparent:true});
 const pts=[A,B];
 const ext = (p,q)=>[p, q];
 const ln = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), mat); ln.renderOrder=10; g.add(ln);
 if (o.length()>0){ for (const [p,q] of [[M(...a),A],[M(...b),B]]){ const e=new THREE.Line(new THREE.BufferGeometry().setFromPoints([p,q]), mat); e.renderOrder=10; g.add(e);} }
 for (const p of [A,B]){ const s=new THREE.Mesh(new THREE.SphereGeometry(0.012,8,8), new THREE.MeshBasicMaterial({color:dimCol(),depthTest:false})); s.position.copy(p); s.renderOrder=11; g.add(s); }
 const el=document.createElement('div'); el.className='dl'+(cls?' '+cls:''); el.textContent=text;

 return g;

const dimGroups = {};
for (const [k] of GROUPS){ dimGroups[k]=new THREE.Group(); scene.add(dimGroups[k]); }
for (const [g,t,a,b,o] of D) dimGroups[g].add(dimension(t,a,b,o));
const dimsEl = document.getElementById('dims');
for (const [k,t,on] of GROUPS){

 stepEl.style.display='block'; sbody.scrollTop=0; stepEl.scrollTop=0; drawSubs();
}
function exitStep(){ stepOn=false; stepEl.style.display='none'; select(null); clearSel(); applyMode(false); }
(function loop(){ requestAnimationFrame(loop); ctl.update(); renderer.render(scene,cam); lab.render(scene,cam); })();
</script>
</body>
